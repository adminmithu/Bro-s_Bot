<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bro's Number Bot - API Status</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 450px;
      border: 1px solid #334155;
    }
    .status-badge {
      background: #10b981;
      color: #022c22;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .endpoint-list {
      text-align: left;
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">🟢 SERVERLESS BOT ACTIVE</div>
    <h1>Bro's Number Bot</h1>
    <p>Your Telegram Virtual Number Bot is running smoothly on Vercel.</p>
    <div class="endpoint-list">
      📍 Webhook Endpoint: /api/bot
    </div>
  </div>
</body>
</html>
